[tool.ruff]
# The README targets Python 3.11+, but telegram_config.py keeps a 3.10
# fallback for tomllib, so lint against the oldest interpreter we support.
target-version = "py310"
line-length = 110
extend-exclude = [".venv", ".venv312", "backups", "exports"]

[tool.ruff.lint]
# Pinned explicitly so `ruff check .` gives the same result locally and in
# CI regardless of any ruff config a developer has outside the repo.
select = [
    "E4", "E7", "E9",  # pycodestyle errors (ruff defaults)
    "F",               # pyflakes: undefined names, unused imports
    "B",               # bugbear: mutable defaults, shadowed loop vars
    "I",               # import ordering
    "UP",              # pyupgrade
    "C4",              # comprehension correctness
    "SIM",             # simplifiable logic
    "RUF",             # ruff-specific correctness
]

ignore = [
    # Naive local dates are deliberate. This is a single-machine factory
    # console in one timezone; production_date, expense_date and
    # attendance_date are calendar days entered by an operator, not
    # instants. Audit timestamps already use database.utc_now().
    "DTZ",
    # Plotly's own API is written with dict(...) throughout; matching it
    # reads better than mixing literals into figure definitions.
    "C408",
    # `with card(...):` wrapping `with st.form(...):` is meaningful
    # nesting in Streamlit, not an accident worth collapsing.
    "SIM117",
    # Every `except Exception` in this codebase was reviewed by hand during
    # the production-hardening pass: each one either surfaces the error in
    # the UI via show_factory_error, records it as a sync status, or
    # re-raises. None of them silently discard a failure.
    "BLE001",
    # The "ambiguous" characters flagged here are deliberate UI glyphs
    # passed to Streamlit's icon= parameter (info, warning, tick), not
    # homoglyphs in identifiers.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import symbols to assert they exist and are exported.
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:database",
    "error::DeprecationWarning:auth",
]
